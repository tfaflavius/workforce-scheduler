name: Keep Alive - Render Backend

# Pinguieste backend-ul de pe Render ca sa nu adoarma (Render Free Tier opreste
# serverul dupa 15 min de inactivitate).
#
# NOTA: Aplicatia are DEJA un keep-alive intern (KeepAliveService, self-ping la
# fiecare 14 min catre /api/health), care e suficient sa tina serverul treaz.
# Programarea automata de aici a fost DEZACTIVATA pentru ca genera esecuri false
# la pene de infrastructura GitHub ("job not acquired by runner"). Ramane doar
# rularea manuala. Ca sa reactivezi ping-ul automat, decomenteaza blocul "schedule".

on:
  # schedule:
  #   # La fiecare 10 minute, 24/7
  #   - cron: '*/10 * * * *'
  workflow_dispatch: # Rulare manuala

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        run: |
          echo "Pinging Render backend at $(date -u '+%Y-%m-%d %H:%M:%S UTC')..."

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            "https://workforce-scheduler-mzgd.onrender.com/api/health")

          echo "Response status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Server is alive (HTTP $HTTP_STATUS)"
          elif [ "$HTTP_STATUS" -eq 000 ]; then
            echo "⚠️ Server did not respond (timeout/connection error). It may be waking up."
            echo "This is normal if the server was sleeping. Next ping should succeed."
          else
            echo "⚠️ Unexpected response (HTTP $HTTP_STATUS)"
          fi
